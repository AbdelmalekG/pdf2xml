<div class="controls">
  <button
    mat-icon-button
    (click)="collapseLeft.emit()">

    <mat-icon>
      keyboard_double_arrow_left
    </mat-icon>
  </button>

  <button
    mat-icon-button
    (click)="reset.emit()">

    <mat-icon>
      drag_handle
    </mat-icon>
  </button>

  <button
    mat-icon-button
    (click)="collapseRight.emit()">

    <mat-icon>
      keyboard_double_arrow_right
    </mat-icon>
  </button>
</div>
